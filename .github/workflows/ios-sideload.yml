name: iOS IPA sideload

on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS deps
        working-directory: mobile
        run: npm ci

      - name: Sync Capacitor iOS
        working-directory: mobile
        run: npx cap sync ios

      - name: CocoaPods
        working-directory: mobile/ios/App
        run: pod install

      - name: Build unsigned device app
        working-directory: mobile/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath "$GITHUB_WORKSPACE/ios-build"

      - name: Pack IPA
        run: |
          APP=$(find "$GITHUB_WORKSPACE/ios-build" -path '*Release-iphoneos/App.app' -type d | head -1)
          test -n "$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/App.app
          zip -qry HADomotics-ios-1.0.1.ipa Payload
          ls -lh HADomotics-ios-1.0.1.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: HADomotics-ios-1.0.1
          path: HADomotics-ios-1.0.1.ipa
          retention-days: 14
