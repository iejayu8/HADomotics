name: Version check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  version-consistency:
    name: Check version files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version consistency
        run: python3 scripts/check_version.py
