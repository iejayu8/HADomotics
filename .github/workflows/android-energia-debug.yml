name: Android Energía (debug APK)

# Solo manual. No publica releases ni firma con el keystore de producción.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate www
        run: python3 scripts/sync_energia_www.py
      - name: Capacitor Android
        working-directory: mobile-energia
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: mobile-energia/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HADomotics-Energia-debug
          path: mobile-energia/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
